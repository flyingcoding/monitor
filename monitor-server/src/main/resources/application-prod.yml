#生产环境配置
server:
  port: 80
# v2.0-tests PR4 hotfix：knife4j 4.5.0 的 Knife4jAutoConfiguration 在 prod 启动时仍尝试装配
# knife4jOpenApiCustomizer(SpringDocConfigProperties)，但 springdoc.api-docs.enabled=false 让
# SpringDocConfigProperties bean 不再产生 → UnsatisfiedDependencyException → APPLICATION FAILED TO START。
# 全局 application.yml 默认 knife4j.enable=true 会传到所有 profile，prod 必须显式覆盖为 false。
# 这是 docker-compose 全栈 e2e 第一次真正启动 prod jar 暴露的潜伏 bug（v1.0-v2.0-frontend-ux 六档
# 都只跑 dev profile + mvn spring-boot:run，从未把 prod 容器跑通过）。
# 业务影响：prod 不需要 Knife4j UI（Swagger 不应出现在生产环境），此改动 zero 业务回归。
springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
spring:
  influx:
    # ⚠ Deprecated（v2.0-beta）：迁移到 monitor.tsdb.influxdb.*；启动时检测到旧 key 会打 WARN，v2.1.x 计划移除
    url: ${INFLUX_URL}
    user: ${INFLUX_USER}
    password: ${INFLUX_PASSWORD}
    bucket: ${INFLUX_BUCKET:program}
    organization: ${INFLUX_ORG:flyingcoding}
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    port: ${MAIL_PORT:25}
  rabbitmq:
    addresses: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
        default-requeue-rejected: false
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/monitor}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    jwt:
      key: ${JWT_KEY}
      expire: 72
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100
  web:
    verify:
      mail-limit: 60
    flow:
      period: 5
      limit: 100
      block: 30
    cors:
      origin: ${CORS_ORIGIN:}
      credentials: false
      methods: '*'
security:
  ssh:
    encrypt-key: ${SSH_ENCRYPT_KEY}
monitor:
  # v1.2 OIDC/SSO 配置（D3 默认策略，prod 默认不自动建号以严格管控）
  oidc:
    enabled: ${MONITOR_OIDC_ENABLED:false}
    auto-create-user: ${MONITOR_OIDC_AUTO_CREATE_USER:false}
    require-email-verified: ${MONITOR_OIDC_REQUIRE_EMAIL_VERIFIED:true}
    link-existing-by-email: ${MONITOR_OIDC_LINK_EXISTING_BY_EMAIL:true}
    default-role: ${MONITOR_OIDC_DEFAULT_ROLE:user}
  # v1.2 共享层占位：API Token HMAC-SHA256 密钥（独立于 JWT_KEY），生产必填
  api-token:
    hmac-key: ${API_TOKEN_HMAC_KEY:}
  # v1.2 共享层占位：密码复杂度策略，生产默认 basic（≥8 字符 + 字母 + 数字）
  password:
    policy: ${PASSWORD_POLICY:basic}
  health-check:
    enabled: ${MONITOR_HEALTH_CHECK_ENABLED:true}
    interval: ${MONITOR_HEALTH_CHECK_INTERVAL:30000}
    stale-threshold-ms: ${MONITOR_HEALTH_CHECK_STALE_THRESHOLD_MS:60000}
    connect-timeout-ms: ${MONITOR_HEALTH_CHECK_CONNECT_TIMEOUT_MS:3000}
    failure-threshold: ${MONITOR_HEALTH_CHECK_FAILURE_THRESHOLD:3}
  influx-buffer:
    # ⚠ Deprecated（v2.0-beta）：迁移到 monitor.tsdb.buffer.*；启动时旧目录 data/influx-buffer/ 会被自动迁移到 data/tsdb-buffer/
    dir: ${MONITOR_INFLUX_BUFFER_DIR:data/influx-buffer}
    replay-interval-ms: ${MONITOR_INFLUX_BUFFER_REPLAY_INTERVAL_MS:15000}
    batch-size: ${MONITOR_INFLUX_BUFFER_BATCH_SIZE:200}
  # v2.0-beta 时序后端适配层：influxdb（默认） / victoria-metrics（v2.0-beta 真实落地）
  tsdb:
    provider: ${MONITOR_TSDB_PROVIDER:influxdb}
    influxdb:
      url: ${INFLUX_URL}
      user: ${INFLUX_USER}
      password: ${INFLUX_PASSWORD}
      bucket: ${INFLUX_BUCKET:program}
      organization: ${INFLUX_ORG:flyingcoding}
    victoria-metrics:
      url: ${VM_URL:http://victoria-metrics:8428}
      query-timeout-ms: ${VM_QUERY_TIMEOUT_MS:5000}
    buffer:
      dir: ${MONITOR_TSDB_BUFFER_DIR:${MONITOR_INFLUX_BUFFER_DIR:data/tsdb-buffer}}
      replay-interval-ms: ${MONITOR_TSDB_BUFFER_REPLAY_INTERVAL_MS:${MONITOR_INFLUX_BUFFER_REPLAY_INTERVAL_MS:15000}}
      batch-size: ${MONITOR_TSDB_BUFFER_BATCH_SIZE:${MONITOR_INFLUX_BUFFER_BATCH_SIZE:200}}
  # v2.0-alpha OTLP/HTTP 接收端点（POST /v1/metrics）
  otlp:
    enabled: ${MONITOR_OTLP_ENABLED:true}
    max-payload-size: ${MONITOR_OTLP_MAX_PAYLOAD_SIZE:4194304}
resilience4j:
  circuitbreaker:
    instances:
      tsdb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
