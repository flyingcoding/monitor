# v2.0-tests 集成测试 profile：仅放静态 / Testcontainers 不会动态注入的配置。
# MySQL / Redis / RabbitMQ 走 @ServiceConnection（Spring Boot 3.5.10 内置）自动注入；
# InfluxDB 走 IntegrationTestBase 的 @DynamicPropertySource 注入。
# 切勿在此文件写 spring.datasource.* / spring.data.redis.* / spring.rabbitmq.* —— Testcontainers 会覆盖。
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    # PR3 hotfix（CI run 26529339906）：AlertFlowIT 已不再用 GreenMail 真投递断言（改用
    # RabbitMQ notification 队列消息断言），这里只保留最低限度配置让 Spring Boot Mail
    # 自动装配不爆炸。host/port 默认值即可（如果 IT 未来又要走真投递再补 SMTP 测试）。
    host: 127.0.0.1
    port: 3025
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    jwt:
      key: it-jwt-secret
      expire: 72
      # PR3 hotfix：集成测试的 @BeforeEach 在数秒内反复触发 /api/auth/login → JwtUtils#createJwt
      # → FlowUtils#limitOnceUpgradeCheck。production 默认 base=10s 意味着「同 user 10s 内仅允许 1 次
      # 生成 JWT」，CI 跑 4 个 IT 类 × N 个 @Test 时第 2+ 次登录立刻拿到 RestBean.code=403
      # ({"message":"登录验证频繁，请稍后再试"}) → 全部 AdminLoginSupport 断言炸。
      # 集成测试要的是冒烟，不需要真实限流；把 base/upgrade 调到 1s/2s + frequency 调到 10000
      # 让 Redis 计数 TTL 极短 + 阈值不可能触发 upgrade-block。同时 AdminLoginSupport 在登录前
      # 主动 DELETE jwt:frequency:1 兜底（belt-and-suspenders）。
      limit:
        base: 1
        upgrade: 2
        frequency: 10000
    filter:
      order: -100
  web:
    verify:
      mail-limit: 60
    flow:
      period: 5
      limit: 100
      block: 30
    cors:
      origin: '*'
      credentials: false
      methods: '*'

security:
  ssh:
    # 与 CI workflow 既有 SSH_ENCRYPT_KEY 一致，避免分歧密钥
    encrypt-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

monitor:
  oidc:
    enabled: false
  api-token:
    # Base64 32-byte 测试固定密钥（与 JWT_KEY 不同）
    hmac-key: aXQtaG1hYy1rZXktZm9yLXRlc3RpbmctMTIzNDU2Nzg5MA==
  password:
    policy: none
  health-check:
    # 避免后台调度任务（ClientHealthCheckTask）干扰集成测试断言
    enabled: false
  otlp:
    enabled: true
    max-payload-size: 4194304
  tsdb:
    provider: influxdb
    buffer:
      # 测试期写到 target/ 下，避免污染开发环境 data/ 目录
      dir: target/tsdb-buffer-it
      replay-interval-ms: 15000
      batch-size: 200

resilience4j:
  circuitbreaker:
    instances:
      tsdb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
