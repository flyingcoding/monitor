name: CI

on:
  push:
    branches: [main, main-v2]
  pull_request:
    branches: [main, main-v2]

jobs:
  server:
    runs-on: ubuntu-latest
    # v2.0-tests：删除 GitHub Actions services 块，集成测试改走 Testcontainers
    # （docker daemon 已是 ubuntu-latest runner 自带），保留 JWT_KEY / SSH_ENCRYPT_KEY / MAIL_*
    # 是因为既有 *Test.java 单测 / Spring 占位符仍可能消费这些环境变量
    env:
      JWT_KEY: test-jwt-key
      SSH_ENCRYPT_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify monitor-server
        run: cd monitor-server && mvn verify -Pdev

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: monitor-web/pnpm-lock.yaml
      - name: Install dependencies
        run: cd monitor-web && pnpm install --frozen-lockfile
      - name: Lint and build
        run: cd monitor-web && pnpm run check
      - name: Run tests
        run: cd monitor-web && pnpm run test -- --run
