version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: monitor
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monitor-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: monitor-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: monitor-influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor-server:
    build:
      context: ./monitor-server
      dockerfile: Dockerfile
    container_name: monitor-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/monitor?useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUX_USER: ${INFLUX_USER}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_ORG: ${INFLUX_ORG}
      MONITOR_TSDB_PROVIDER: ${MONITOR_TSDB_PROVIDER:-influxdb}
      VM_URL: ${VM_URL:-http://victoria-metrics:8428}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      JWT_KEY: ${JWT_KEY}
      API_TOKEN_HMAC_KEY: ${API_TOKEN_HMAC_KEY}
      SSH_ENCRYPT_KEY: ${SSH_ENCRYPT_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # v2.0-tests PR4：JWT 限流参数可被 .env 覆盖（e2e job 设为 1/2/10000 跑 Playwright，
      # 正式生产保持默认 10/300/30 即受限）
      MONITOR_JWT_LIMIT_BASE: ${MONITOR_JWT_LIMIT_BASE:-10}
      MONITOR_JWT_LIMIT_UPGRADE: ${MONITOR_JWT_LIMIT_UPGRADE:-300}
      MONITOR_JWT_LIMIT_FREQUENCY: ${MONITOR_JWT_LIMIT_FREQUENCY:-30}
    ports:
      - "8001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  monitor-client:
    profiles: ["client"]
    build:
      context: ./monitor-client
      dockerfile: Dockerfile
    container_name: monitor-client
    restart: always
    depends_on:
      monitor-server:
        condition: service_healthy
    environment:
      MONITOR_SERVER: http://monitor-server:80
      MONITOR_TOKEN: ${MONITOR_TOKEN}

  monitor-web:
    build:
      context: ./monitor-web
      dockerfile: Dockerfile
    container_name: monitor-web
    restart: always
    depends_on:
      - monitor-server
    ports:
      - "80:80"

  # v2.0-beta：VictoriaMetrics 单节点（可选，opt-in via `--profile vm`）。
  # 启动：`make up-vm` 或 `docker compose --profile vm up -d victoria-metrics`
  victoria-metrics:
    profiles: ["vm"]
    image: victoriametrics/victoria-metrics:v1.143.0
    container_name: monitor-victoria-metrics
    restart: always
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION:-90d}"
      - "-httpListenAddr=:8428"
    ports:
      - "${VM_PORT:-8428}:8428"
    volumes:
      - ${VM_DATA_DIR:-./data/victoria-metrics}:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # v2.0-beta：InfluxDB 2.7 → VictoriaMetrics 一次性迁移任务（opt-in via `--profile migration`）。
  # 启动：`make migrate-influx-to-vm`（等价 `docker compose --profile migration run --rm vmctl-migrate`）。
  # 由于 vmctl 不直接支持 InfluxDB v2 token，需要先在 InfluxDB 上 `influx v1 auth create` 建 v1 凭证，
  # 并把这些凭证填入 INFLUX_V1_USERNAME / INFLUX_V1_PASSWORD（详见 docs/v2.0-beta-vm.md）。
  vmctl-migrate:
    profiles: ["migration"]
    image: victoriametrics/vmctl:v1.143.0
    container_name: monitor-vmctl-migrate
    command:
      - "influx"
      - "--influx-addr=${INFLUX_V1_URL:-http://influxdb:8086}"
      - "--influx-database=${INFLUX_BUCKET:-program}"
      - "--influx-user=${INFLUX_V1_USERNAME:-}"
      - "--influx-password=${INFLUX_V1_PASSWORD:-}"
      - "--vm-addr=${VM_URL:-http://victoria-metrics:8428}"
      - "--influx-measurement-field-separator=_"
      - "-s"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  influxdb-data:
